<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7f3">
  <title>Halaman tidak ditemukan — TCS Template</title>
  <link rel="stylesheet" href="/assets/css/styles.css">
  <style>
    .not-found { min-height: 100vh; display: grid; place-items: center; padding: 40px 20px; text-align: center; }
    .not-found-inner { max-width: 520px; }
    .not-found-code { margin: 0; color: #78917b; font-size: 13px; font-weight: 800; letter-spacing: .2em; }
    .not-found h1 { margin: 12px 0; font-size: clamp(42px, 8vw, 68px); line-height: 1; letter-spacing: -.07em; }
    .not-found p { margin: 0 auto 24px; color: #78837a; font-size: 14px; }
  </style>
</head>
<body>
  <main class="not-found">
    <div class="not-found-inner">
      <p class="not-found-code">ERROR / 404</p>
      <h1>Halaman tidak ditemukan.</h1>
      <p>Alamat yang Anda buka tidak tersedia atau sudah berubah. Kembali ke katalog TCS Template untuk melanjutkan.</p>
      <a class="button button-primary" href="/">Kembali ke halaman utama <span aria-hidden="true">↗</span></a>
    </div>
  </main>
</body>
</html>
